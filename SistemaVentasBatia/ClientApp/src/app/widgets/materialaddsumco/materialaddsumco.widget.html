                </div>

                                <input type="text" class="form-control" [(ngModel)]="productosfil.keywords" asp-for="Keywords" (keyup)="onKeywordsProductoInput()" id="txtProductoSumco">
                                <label for="txtProducto">Buscar producto</label>
                            </div>
                        </div>

                        <div *ngIf="productosfil.productos && productosfil.productos.length == 0 && isLoading == false" class="text-center">
                            <hr />
                            <br />
                            <h6>No se encontraron registros</h6>
                        </div>
                        <div *ngIf="productosfil.productos && productosfil.productos.length > 0" class="table-container box-shadow fade-in-container">
                            <table class="table table-striped table-responsive">
                                <thead class="sticky-top">
                                    <tr class="d-md-none">
                                        <th class="ps-2">Lista de productos</th>
                                        <th></th>
                                    </tr>
                                    <tr class="d-none d-md-table-row">
                                        <th>
                                            <div class="row">
                                                <div class="col-md-3 col-sm-4 col-2 text-start">
                                                    <span class="ms-2">Clave</span>
                                                </div>
                                                <div class="col-md-6 col-sm-6 col-10">
                                                    <span class="ms-2">Descripción</span>
                                                </div>
                                            </div>
                                        </th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let mat of productosfil.productos">
                                        <td class="align-middle">
                                            <div class="row d-flex align-items-center">
                                                <div class="col-md-3 col-sm-4 col-2 text-start">
                                                    <span class="badge d-md-none">Clave:</span>
                                                    <div class="ms-2">{{ mat.clave }}</div>
                                                </div>
                                                <div class="col-md-6 col-sm-3 col-10">
                                                    <span class="badge d-md-none">Descripcion:</span>
                                                    <div class="ms-2">{{ mat.descripcion }}</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="text-center">
                                            <a class="btn btn-sm btn-outline-primary" (click)="addProducto(mat.idProducto)" data-bs-toggle="tooltip" title="Agregar">
                                                <i class="fa-solid fa-plus fa-1x"></i>
                                            </a>
                                            <!--<a class="btn btn-sm btn-outline-danger" (click)="removeSumcoProd(mat.idProducto)" data-bs-toggle="tooltip" title="Eliminar">
                                                <i class="fa-solid fa-times fa-2x"></i>
                                            </a>-->
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <br />
                        <div *ngIf="productosfil.productos && productosfil.productos.length > 0">
                            <pagina-widget [pagina]="productosfil.pagina" [numPaginas]="productosfil.numPaginas" [rows]="productosfil.rows" (chgEvent)="prodPagina($event)"></pagina-widget>
                        </div>
                        <br />

                    <button type="button" id="btnGuardarMaterial" (click)="guarda()" class="btn btn-outline-success d-flex align-items-center" [disabled]="isLoading"><i class="fa-solid fa-save fa-xl me-2"></i> Guardar</button>
