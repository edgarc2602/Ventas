<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="modal fade" id="registermaterialsumco" data-bs-backdrop="static">
        <div [ngClass]="idServicioCotizacion == 5 && isExtra == false ? 'modal-dialog modal-dialog-centered':'modal-dialog modal-lg modal-dialog-centered'">
            <div class="modal-content">
                <!--Modal Header-->
                <div class="modal-header">
                    <h4 *ngIf="model.idProducto == 0" class="modal-title">Agregar Producto</h4>
                    <h4 *ngIf="model.idProducto > 0" class="modal-title">Editar Producto</h4>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row d-flex align-items-center">
                        <div class="col-md-5 mb-3">
                            <div class="form-floating">
                                <input type="text" class="form-control" [(ngModel)]="model.nombre" id="txtNombre">
                                <label for="txtNombre">Nombre</label>
                            </div>
                            <span *ngIf="ferr('Nombre')" class="text-danger">{{ terr('Nombre') }}</span>
                        </div>
                        <div class="col-3 col-md-3 col-sm-3 mb-3">
                            <div class="form-floating">
                                <select class="form-select" aria-label="IdUnidad" [(ngModel)]="model.idUnidad" id="ddlIdUnidad">
                                    <option value="0">Seleccione...</option>
                                    <option *ngFor="let f of unidades" [ngValue]="f.id">{{ f.descripcion }}</option>
                                </select>
                                <label for="ddlFrecuenciaMaterial">Unidad</label>
                            </div>
                            <span *ngIf="ferr('IdUnidad')" class="text-danger">{{ terr('IdUnidad') }}</span>
                        </div>
                        <div class="col-md-4  mb-3">
                            <div class="form-floating">
                                <input type="number" class="form-control" [(ngModel)]="model.precio" id="txtPrecio">
                                <label for="txtPrecio">Precio</label>
                            </div>
                            <span *ngIf="ferr('Precio')" class="text-danger">{{ terr('Precio') }}</span>
                        </div>
                        <div class="col-md-3  mb-3">
                            <div class="form-floating">
                                <input type="number" class="form-control" [(ngModel)]="model.precioCompra" id="txtPrecioCompra">
                                <label for="txtPrecioCompra">Precio Compra</label>
                            </div>
                            <span *ngIf="ferr('PrecioCompra')" class="text-danger">{{ terr('PrecioCompra') }}</span>
                        </div>
                    </div>
                </div>
                <!--Modal footer-->
                <div class="modal-footer">
                    <button type="button" id="btnGuardarMaterial" (click)="guarda()" class="btn btn-outline-success d-flex align-items-center" [disabled]="isLoading"><i class="fa-solid fa-save fa-xl me-2"></i> Guardar</button>
                    <button type="button" class="btn btn-outline-secondary" (click)="close()" data-bs-dismiss="modal">Cancelar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
<carga-widget></carga-widget>
<toast-widget></toast-widget>
